name: ddb-api

on:
  push:
    paths:
      - "ddb/**"
      - ".github/workflows/darango-api.yml"
  pull_request:
    paths:
      - "ddb/**"
      - ".github/workflows/darango-api.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: ddb
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        working-directory: ddb
        run: pytest -q
  mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ddb/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ddb/mcp/package-lock.json
      - name: Install MCP dependencies
        run: npm ci
      - name: Build MCP views and type-check server
        run: npm run build
